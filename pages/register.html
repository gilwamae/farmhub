<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | FarmHub</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- FarmHub CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body class="auth-page">


    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header class="auth-header">

        <div class="auth-header-container">

            <a
                href="../index.html"
                class="auth-logo"
            >
                Farm<span>Hub</span>
            </a>

            <a
                href="login.html"
                class="auth-header-link"
            >
                Already have an account?
                <strong>Login</strong>
            </a>

        </div>

    </header>


    <!-- =========================================================
         REGISTRATION
         ========================================================= -->

    <main class="auth-main">

        <div class="auth-container">

            <div class="auth-card register-card">


                <div class="auth-heading">

                    <div class="auth-icon">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>

                    <h1>Create Your Account</h1>

                    <p>
                        Join FarmHub and access trusted
                        farm products and services.
                    </p>

                </div>


                <!-- =================================================
                     REGISTRATION FORM
                     ================================================= -->

                <form
                    id="registerForm"
                    class="auth-form"
                    novalidate
                >


                    <!-- Full name -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="fullName"
                                name="fullName"
                                placeholder="Enter your full name"
                                autocomplete="name"
                                required
                            >

                        </div>

                        <small
                            class="form-error"
                            id="fullNameError"
                        ></small>

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="registerEmail"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                        <small
                            class="form-error"
                            id="registerEmailError"
                        ></small>

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-phone"></i>

                            <input
                                type="tel"
                                id="phone"
                                name="phone"
                                placeholder="e.g. 0712 345 678"
                                autocomplete="tel"
                                required
                            >

                        </div>

                        <small
                            class="form-error"
                            id="phoneError"
                        ></small>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="registerPassword"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="registerPassword"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>

                        </div>

                        <small
                            class="form-error"
                            id="registerPasswordError"
                        ></small>

                    </div>


                    <!-- Confirm password -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-lock"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Repeat your password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-target="confirmPassword"
                            >
                                <i class="fa-regular fa-eye"></i>
                            </button>

                        </div>

                        <small
                            class="form-error"
                            id="confirmPasswordError"
                        ></small>

                    </div>


                    <!-- Terms -->

                    <div class="form-checkbox">

                        <label>

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            <span>
                                I agree to the
                                <a href="#">
                                    Terms & Conditions
                                </a>
                                and
                                <a href="#">
                                    Privacy Policy
                                </a>.
                            </span>

                        </label>

                    </div>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="auth-submit"
                    >

                        <span>Create Account</span>

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>


                </form>


                <div class="auth-footer">

                    <p>

                        Already registered?

                        <a href="login.html">
                            Login here
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </main>


    <script src="../js/auth.js"></script>

</body>

</html>
